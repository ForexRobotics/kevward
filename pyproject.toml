[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kevward"
version = "0.2.0"
description = "Defensive server hardening & patch automation for Ubuntu (plugin-based)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Forex Robotics Co., Ltd." }]
keywords = ["security", "patch-management", "ubuntu", "hardening", "cisa-kev", "fail2ban"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
  "Topic :: Security",
]
# Core tool uses only the standard library, except on Python 3.10 where the
# TOML parser (tomllib) is backported via tomli. Service integrations (apt,
# composer, npm, wp-cli, fail2ban, logwatch) are detected at runtime.
dependencies = [
  'tomli; python_version < "3.11"',
]

[project.urls]
Homepage = "https://github.com/ForexRobotics/kevward"
Issues = "https://github.com/ForexRobotics/kevward/issues"

[project.scripts]
kevward = "kevward.cli:main"

[tool.setuptools.packages.find]
include = ["kevward*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  # kevward deliberately catches broad exceptions so one failing plugin or
  # feed never aborts a whole run (it's a defensive, unattended tool).
  "B904",
]

[tool.ruff.lint.per-file-ignores]
# Plugins use class-level lists as overridable defaults by design.
"kevward/plugins/*" = ["RUF012"]
# The HTML report is a template; long inline markup lines are expected.
"kevward/reporting/html.py" = ["E501"]
