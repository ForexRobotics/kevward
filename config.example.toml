# kevward configuration (TOML). Copy to /etc/kevward/config.toml.
# Every value shown is the built-in default unless noted. All defaults are safe:
# nothing changes the system until you run `apply --yes`, and reboots never
# happen unless allow_reboot is true AND a reboot is requested.

report_dir = "/var/log/kevward"

[policy]
apply_security = true      # apply security updates when running `apply`
apply_minor    = false     # also apply non-security minor upgrades
allow_reboot   = false     # permit kevward to reboot the host at all
reboot_window_start = "04:00"   # local HH:MM for scheduled reboots

# Limit to specific services (empty = all discovered plugins):
# services = ["apt", "nginx", "php", "sshd", "ufw"]

# --- per-service overrides -------------------------------------------------
# Tell the composer/laravel/node/wordpress scanners where your apps live:
[policy.overrides.laravel]
# paths scanned for Laravel apps (artisan + composer.lock)
# roots = ["/var/www/hokaku_server", "/srv/app"]

[policy.overrides.wordpress]
# roots = ["/var/www/blog"]

[policy.overrides.nginx]
# e.g. allow minor nginx upgrades even though the global default is off
# apply_minor = true

# --- active-defense blocklist (`kevward firewall`) -------------------------
# Builds a kevward-owned nftables set of high-confidence attacker IPs from this
# host's own fail2ban/sshd evidence. Local host only; dry-run by default.
[firewall]
ttl_days = 14              # blocklist entries age out after this many days
min_sshd_failures = 20     # sshd failures for an IP to qualify (bans always do)
# Extra CIDRs/IPs that must NEVER be blocked. Loopback, RFC1918, CGNAT and the
# current SSH/admin source are always allowlisted automatically; add your own:
# allow = ["203.0.113.0/24", "198.51.100.10"]
# Optional DNSBL cross-check (off by default -> no network call). When on, only
# the top-N candidates are looked up; see `firewall --require-reputation`.
# check_dnsbl = false
# dnsbl_zone = "zen.spamhaus.org"   # or a Spamhaus DQS zone: "<key>.zen.dq.spamhaus.net"
# dnsbl_resolver = "1.2.3.4"        # query this resolver directly (recommended); unset = system resolver
# dnsbl_top_n = 10
# dnsbl_cache_days = 7
