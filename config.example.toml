# kevward configuration (TOML). Copy to /etc/kevward/config.toml.
# Every value shown is the built-in default unless noted. All defaults are safe:
# nothing changes the system until you run `apply --yes`, and reboots never
# happen unless allow_reboot is true AND a reboot is requested.

report_dir = "/var/log/kevward"

[policy]
apply_security = true      # apply security updates when running `apply`
apply_minor    = false     # also apply non-security minor upgrades
allow_reboot   = false     # permit kevward to reboot the host at all
reboot_window_start = "04:00"   # local HH:MM for scheduled reboots

# Limit to specific services (empty = all discovered plugins):
# services = ["apt", "nginx", "php", "sshd", "ufw"]

# --- per-service overrides -------------------------------------------------
# Tell the composer/laravel/node/wordpress scanners where your apps live:
[policy.overrides.laravel]
# paths scanned for Laravel apps (artisan + composer.lock)
# roots = ["/var/www/hokaku_server", "/srv/app"]

[policy.overrides.wordpress]
# roots = ["/var/www/blog"]

[policy.overrides.nginx]
# e.g. allow minor nginx upgrades even though the global default is off
# apply_minor = true

# --- active-defense blocklist (`kevward firewall`) -------------------------
# Builds a kevward-owned nftables set of high-confidence attacker IPs from this
# host's own fail2ban/sshd evidence. Local host only; dry-run by default.
[firewall]
ttl_days = 14              # blocklist entries age out after this many days
min_sshd_failures = 20     # sshd failures for an IP to qualify (bans always do)
# Extra CIDRs/IPs that must NEVER be blocked. Loopback, RFC1918, CGNAT and the
# current SSH/admin source are always allowlisted automatically; add your own:
# allow = ["203.0.113.0/24", "198.51.100.10"]
# Permanent blocks (CIDR or IP, no TTL) -- the mirror of `allow`, for known-bad
# attacker networks. The allowlist above still always wins over these.
# block = ["109.160.32.0/24", "77.239.124.0/24"]
# Re-apply the blocklist on boot via a kevward-owned systemd unit (default on).
# persist = true
# In a multipass guest, never block the host side of the NAT (the default
# gateway that `multipass shell` comes from, #251). Shown in `firewall plan`.
# allow_gateway = true
# Optional DNSBL cross-check (off by default -> no network call). When on, only
# the top-N candidates are looked up; see `firewall --require-reputation`.
# check_dnsbl = false
# dnsbl_zone = "zen.spamhaus.org"   # or a Spamhaus DQS zone: "<key>.zen.dq.spamhaus.net"
# dnsbl_resolver = "1.2.3.4"        # query this resolver directly (recommended); unset = system resolver
# dnsbl_top_n = 10
# dnsbl_cache_days = 7

# --------------------------------------------------------------------------- #
# Host compromise indicators (`kevward audit`, `report --audit`)
# --------------------------------------------------------------------------- #
[audit]
# authorized_keys forced commands you expect (glob on the command="..." value).
# Matching keys are not reported; any other forced-command key still is.
# allowed_forced_commands = ["/opt/kevward/bin/kevward report *", "rrsync *"]
# Outbound connections you expect, as "<process glob>:<port glob>" with an
# optional "@<cidr>" (e.g. a Tor client to ORPort 9001). Matches are counted
# in one "allowed outbound: N" line instead of listed; a shell-owned socket
# (possible reverse shell) is always reported. "*:*" is rejected.
# allowed_outbound = ["tor:9001", "node-exporter:9100", "*:5222@203.0.113.0/24"]

# --------------------------------------------------------------------------- #
# CISA KEV matching (`trends`, `report --trends`)
# --------------------------------------------------------------------------- #
[trends]
# Time budget (seconds) for the version-aware pass that checks each KEV match
# against Ubuntu's per-CVE data. Cached CVEs are free; an uncached kernel CVE
# takes ~5s, so a host with many "not checked" rows resolves faster with a
# larger budget (at the cost of a slower report). Clamped to 0..600.
# version_budget_s = 45
# Max network lookups per run (cached CVEs don't count). Clamped to 0..1000.
# max_version_checks = 80
# Lookups run this many at a time (1 = one by one). Clamped to 1..16.
# fetch_workers = 4

# --------------------------------------------------------------------------- #
# apt: how pending updates are classified and installed
[apt]
# Updates from these apt origins count as security updates (HIGH, applied by
# `apply` with apply_security). Globs against the origin name, e.g. the
# ondrej/php PPA. Empty by default.
# security_origins = ["LP-PPA-ondrej-php"]
# Ask php.net (cached 12h) whether a pending PHP upgrade from a non-security
# origin (ondrej/php PPA, sury) is a PHP security release; if so it is
# reported and applied as a security update. false for air-gapped hosts.
# php_release_check = true
# Time limit for `apt-get install` during `apply`, in seconds (0 = none).
# A kernel install can take minutes on a small VPS. Clamped to 0 or 300..86400.
# install_timeout_s = 3600

# --------------------------------------------------------------------------- #
# Newer-release notice (read-only: kevward never upgrades itself)
# --------------------------------------------------------------------------- #
[update]
# Look up the latest kevward on PyPI once a day and show an INFO finding in the
# report when a newer release exists. Set false on air-gapped hosts.
# check = true

# --------------------------------------------------------------------------- #
# HTML report
[report]
# Language of the report's headings, labels and summary lines: "en" or "ja".
# Finding titles/details, JSON and CLI output stay English for now.
# `kevward report --lang ja` overrides this for one run.
# lang = "en"

# --------------------------------------------------------------------------- #
# ssh-gate: forced command for collection / console SSH keys (#185)
[ssh_gate]
# Off by default. Turn on only if an authorized_keys line uses
# `kevward ssh-gate --role read|operate` as its forced command. Not writable
# through the gate itself. See "Restricted SSH keys" in the README.
# enabled = false
# Allow the `self.update` op (pip install kevward==X.Y.Z as root). Off by default.
# self_update = false
# Lowest version self.update may install (rollback floor). Empty = the first
# release with self.update.
# min_version = ""
# truthgate relay (#219): `truthgate.*` ops are passed unparsed to
# `<truthgate_path> ssh-gate --role <role>`. The binary and its directories
# must be root-owned and not group/world-writable. Not writable through the gate.
# truthgate_path = "/usr/bin/truthgate"
# truthgate_timeout_s = 120              # 1-3600; SIGTERM, then SIGKILL after 5 s
# truthgate_capabilities_timeout_s = 5   # 1-60; for gate.capabilities
