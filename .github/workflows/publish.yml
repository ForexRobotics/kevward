name: Publish to PyPI

# Publishes on a version tag (e.g. v0.2.0) using PyPI Trusted Publishing
# (OIDC) — no API token or secret is stored in the repo.
#
# One-time setup on PyPI: create the project (or a "pending publisher") at
# https://pypi.org/manage/account/publishing/ with:
#   owner = ForexRobotics, repo = kevward, workflow = publish.yml,
#   environment = pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
