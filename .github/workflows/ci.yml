name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install .

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: |
          pip install pytest
          pytest -q

      - name: Smoke test
        run: |
          kevward --version
          kevward list-plugins
          # read-only run; must exit cleanly even on a bare CI runner
          kevward check
          kevward report -o /tmp/kevward-report.html
          test -s /tmp/kevward-report.html
