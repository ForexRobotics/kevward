name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Python-version matrix on the newest release we run in production. Job
  # names are required status checks in the `protect main` ruleset - keep them.
  lint-and-smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install .

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: |
          pip install pytest
          pytest -q

      - name: Smoke test
        run: |
          kevward --version
          kevward list-plugins
          # read-only run; must exit cleanly even on a bare CI runner
          kevward check
          kevward report -o /tmp/kevward-report.html
          test -s /tmp/kevward-report.html

  # Each supported Ubuntu release with its own system python3 in a venv - the
  # same way kevward is deployed (/opt/kevward). ubuntu-latest is not used so
  # the tested releases never change silently.
  distro-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install into a venv with the distro python3
        run: |
          . /etc/os-release && echo "$PRETTY_NAME"
          python3 --version
          python3 -m venv /tmp/kv
          /tmp/kv/bin/pip install --upgrade pip
          /tmp/kv/bin/pip install . pytest

      - name: Tests (pytest)
        run: /tmp/kv/bin/pytest -q

      - name: Smoke test
        run: |
          K=/tmp/kv/bin/kevward
          $K --version
          $K list-plugins
          $K check
          $K report -o /tmp/kevward-report.html
          test -s /tmp/kevward-report.html
